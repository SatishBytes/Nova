<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan projects, collaborate with your team, and deliver work with NOVA." />
    <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11141d" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOVA" />
    <meta property="og:title" content="NOVA — Plan. Collaborate. Deliver." />
    <meta property="og:description" content="A calm workspace to plan projects, collaborate, and deliver." />
    <!-- TODO: Replace the production origin if the NOVA site URL changes. -->
    <meta property="og:url" content="https://nova-eta-swart.vercel.app/" />
    <meta property="og:image" content="https://nova-eta-swart.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOVA — Plan. Collaborate. Deliver." />
    <meta name="twitter:description" content="A calm workspace to plan projects, collaborate, and deliver." />
    <meta name="twitter:image" content="https://nova-eta-swart.vercel.app/og-image.png" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('nova-theme') || 'system';
          const dark = preference === 'dark'
            || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) document.documentElement.classList.add('dark');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>NOVA — Plan. Collaborate. Deliver.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
